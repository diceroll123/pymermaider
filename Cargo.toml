[package]
name = "pymermaider"
version = "0.1.6"
edition = "2021"
description = "Generate Mermaid class diagrams from Python source code"
repository = "https://github.com/diceroll123/pymermaider"
license = "MIT"

[lib]
name = "pymermaider_wasm"
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory"]

[[bench]]
name = "diagram_benches"
harness = false

[[bin]]
name = "pymermaider"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"], optional = true }
env_logger = { version = "0.11.8", default-features = false, features = ["auto-color", "color"], optional = true }
ignore = { version = "0.4.25", features = ["simd-accel"], optional = true }
ruff_workspace = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10", optional = true }
rayon = { version = "1.10", optional = true }
indexmap = "2.7.0"
itertools = "0.15.0"
log = "0.4.28"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10" }
ruff_python_codegen = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10" }
ruff_python_semantic = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10" }
ruff_python_stdlib = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10" }
ruff_source_file = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10" }
ruff_linter = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10" }
ruff_db = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10", default-features = false, optional = true }
ty_project = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10", default-features = false, optional = true }
ty_python_core = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10", optional = true }
ty_python_semantic = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10", optional = true }
globset = "0.4.18"
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

# Ensure getrandom and uuid work with WASM (0.4 required by uuid/rand)
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js"] }

# Real filesystem access for ty (venv and cross-file resolution). ruff_db's `os` feature does not
# build for wasm32, hence the target table. Keep this tag equal to the `ruff_db` entry above;
# Renovate bumps both with the other ruff crates, and a mismatch fails the build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ruff_db = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.10", default-features = false, features = ["os"], optional = true }

[dev-dependencies]
tempfile = "3.23.0"
anyhow = "1.0.100"
ctor = "1.0.0"
criterion = { version = "0.8", default-features = false }
divan = { version = "5.0.0", package = "codspeed-divan-compat" }

[[bench]]
name = "parse_render"
harness = false

[features]
default = ["cli", "infer"]
infer = ["dep:ruff_db", "dep:ty_project", "dep:ty_python_core", "dep:ty_python_semantic"]
cli = ["clap", "env_logger", "ignore", "dep:rayon", "dep:ruff_workspace"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 3
