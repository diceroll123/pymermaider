name: Run Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup default nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run tests without type inference
        run: cargo test --verbose --no-default-features --features cli

  build-python-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Build wheel
        run: |
          uv venv
          uv pip install maturin
          uv run maturin build --release --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl

  python-install-and-test:
    needs: build-python-wheel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist

      - name: Install and test on Python ${{ matrix.python-version }}
        run: |
          uv venv
          uv pip install dist/*.whl
          uv run python - <<'PY'
import sys

import pymermaider

diagram = pymermaider.generate(
    "class A:\n    pass\n",
    direction="LR",
    title="Test",
)
assert diagram.startswith("---\ntitle: Test\n---\nclassDiagram"), diagram
assert "class A" in diagram, diagram

md = pymermaider.to_markdown("class B:\n    pass\n")
assert md.startswith("```mermaid\n"), md

try:
    pymermaider.generate("class C:\n", direction="NOWHERE")
except ValueError:
    pass
else:
    raise AssertionError("expected ValueError for invalid direction")

print(f"pymermaider {pymermaider.__version__} OK on Python "
      f"{sys.version_info.major}.{sys.version_info.minor}")
PY

  all-python-builds-pass:
    needs: python-install-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Echo success
        run: echo "All builds passed"
