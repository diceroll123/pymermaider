name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: 10

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: x86_64
            target: x86_64
            cache_key: x86_64
            artifact_name: wheels-macos-x86_64
            args: --release --find-interpreter --out dist
          - name: universal
            target: universal2-apple-darwin
            cache_key: universal
            artifact_name: wheels-macos-universal
            args: --release --find-interpreter --out dist
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.cache_key }}
      - name: "Build wheels - ${{ matrix.platform.name }}"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ matrix.platform.args }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
          - target: i686-pc-windows-msvc
          - target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - name: "Configure Git to support long paths"
        run: git config --system core.longpaths true
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}
      # No --find-interpreter: the runner only has x86_64 Pythons, so
      # interpreter discovery fails for the i686/aarch64 targets. That is fine
      # because pyo3 >= 0.29 links raw-dylibs on Windows, so maturin builds the
      # abi3 wheels without an interpreter (it auto-generates the import lib).
      - name: "Build wheels - windows"
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist --target ${{ matrix.platform.target }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: i686-unknown-linux-gnu
            arch: x86
            # 32-bit release builds OOM on the 7 GB ubuntu runner: ruff's ty_*
            # crates are huge, and fat LTO + codegen-units=1 makes two of them
            # compile in parallel exceed available memory. Thin LTO and more
            # codegen units keep peak memory well under the limit.
            # The 32-bit CentOS 7 image cannot resolve DNS under docker's default
            # seccomp profile on current runners (yum install libatomic fails).
            maturin_docker_options: -e CARGO_PROFILE_RELEASE_LTO=thin -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 --security-opt seccomp=unconfined
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}
      - name: "Build wheels - linux"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: auto
          command: build
          args: --release --find-interpreter -o dist
          docker-options: ${{ matrix.platform.maturin_docker_options }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  linux-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            maturin_docker_options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
          - target: armv7-unknown-linux-gnueabihf
            arch: armv7
          - target: s390x-unknown-linux-gnu
            arch: s390x
            maturin_docker_options: -e CFLAGS_s390x_unknown_linux_gnu=-march=z10
          - target: powerpc64le-unknown-linux-gnu
            arch: ppc64le
          - target: powerpc64-unknown-linux-gnu
            arch: ppc64
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}
      - name: "Build wheels - linux-cross"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: auto
          docker-options: ${{ matrix.platform.maturin_docker_options }}
          args: --release --find-interpreter -o dist
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: i686-unknown-linux-musl
            arch: x86
            # Same 32-bit OOM risk as the gnu build; see `linux` job above.
            maturin_docker_options: -e CARGO_PROFILE_RELEASE_LTO=thin -e CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.platform.target }}
      - name: "Build wheels - musllinux"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --release --find-interpreter -o dist
          docker-options: ${{ matrix.platform.maturin_docker_options }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  musllinux-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            maturin_docker_options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.platform.target }}
      - name: "Build wheels - musllinux-cross"
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2
          args: --release --find-interpreter -o dist
          docker-options: ${{ matrix.platform.maturin_docker_options }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist

  # this only exists for making github action protections easier to manage
  all-builds-pass:
    name: All builds pass
    runs-on: ubuntu-latest
    needs:
      - linux
      - linux-cross
      - macos
      - musllinux
      - musllinux-cross
      - windows
    steps:
      - name: Echo success
        run: echo "All builds passed"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - all-builds-pass
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing *
