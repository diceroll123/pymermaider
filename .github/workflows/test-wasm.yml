name: Test WASM Build

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check WASM library compilation
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features

      - name: Check WASM library compilation with type inference
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features --features infer

      - name: Run Rust tests
        run: cargo test --lib --no-default-features

      - name: Check CLI compilation
        run: cargo check --features cli
